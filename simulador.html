<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de sensores</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; padding: 1.5rem 1rem; color: #1e293b; }
    main { max-width: 420px; width: 100%; }
    h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
    p.nota { font-size: .85rem; color: #64748b; margin: 0 0 1rem; }
    .fila { margin: 1rem 0; }
    .fila label { display: flex; justify-content: space-between; font-weight: 600; font-size: .95rem; }
    input[type=range] { width: 100%; }
    .botones { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: 1rem 0; }
    button { font-size: 1rem; padding: .7rem; border: 0; border-radius: 10px; color: #fff; background: #4A7C59; cursor: pointer; width: 100%; }
    button.sec { background: #64748b; font-size: .9rem; padding: .6rem; }
    .auto { display: flex; align-items: center; gap: .5rem; margin: .8rem 0; font-size: .95rem; }
    #estado { font-size: .9rem; margin-top: 1rem; padding: .8rem; border-radius: 10px; background: #f1f5f9; white-space: pre-line; }
  </style>
</head>
<body>
  <main>
    <h1>Simulador de sensores</h1>
    <p class="nota">Hace de circuito: envía lecturas a la hoja y muestra cómo el script las clasifica. Los niveles salen de los números, nunca de una etiqueta.</p>

    <div class="fila"><label>Luz <span id="v-luz">600</span></label>
      <input type="range" id="luz" min="0" max="4095" step="5" value="600"></div>
    <div class="fila"><label>Sonido <span id="v-sonido">150</span></label>
      <input type="range" id="sonido" min="0" max="4095" step="5" value="150"></div>
    <div class="fila"><label>Personas <span id="v-personas">1</span></label>
      <input type="range" id="personas" min="0" max="15" step="1" value="1"></div>

    <div class="botones">
      <button class="sec" data-p="600,150,1">Tranquilo</button>
      <button class="sec" data-p="1800,700,5">Moderado</button>
      <button class="sec" data-p="3500,1800,9">Intenso</button>
    </div>

    <button id="enviar">Enviar ahora</button>
    <label class="auto"><input type="checkbox" id="auto" checked> Reenviar cada 20 segundos (mantiene el dato "reciente")</label>
    <div id="estado">Listo para enviar.</div>
  </main>

  <script>
    // PEGA AQUÍ la URL /exec de tu implementación (la misma de index.html)
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwCduWdf8B008rOjOxmgalCSM3pqXcirAmv96ZlFoWL-qPdghz2rFAIxA8bKWQN-MjX6w/exec";
    const TOKEN_SENSORES = "9012";   // clave del circuito
    const TOKEN = "1234";            // clave de lectura de la app
    const ZONA = "Sala de espera";

    const NOMBRES = { luz: ["Luz suave", "Luz normal", "Luz muy fuerte"],
                      sonido: ["Silencioso", "Ruido moderado", "Ruido alto"],
                      personas: ["Pocas personas", "Algo de gente", "Muchas personas"] };
    const ids = ["luz", "sonido", "personas"];
    const estado = document.getElementById("estado");

    ids.forEach(id => document.getElementById(id).addEventListener("input", e => {
      document.getElementById("v-" + id).textContent = e.target.value;
    }));
    document.querySelectorAll("button[data-p]").forEach(b => b.addEventListener("click", () => {
      b.dataset.p.split(",").forEach((v, i) => {
        document.getElementById(ids[i]).value = v;
        document.getElementById("v-" + ids[i]).textContent = v;
      });
      enviar();
    }));

    async function pedir(cuerpo) {
      const r = await fetch(URL_SCRIPT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(cuerpo) });
      return r.json();
    }

    async function enviar() {
      const v = {}; ids.forEach(id => v[id] = Number(document.getElementById(id).value));
      estado.textContent = "Enviando…";
      try {
        const r = await pedir({ accion: "lectura", token: TOKEN_SENSORES, zona: ZONA, luz: v.luz, sonido: v.sonido, personas: v.personas, origen: "simulado" });
        if (r.status !== "success") { estado.textContent = "No se pudo enviar: " + (r.message || JSON.stringify(r)); return; }

        // Confirma cómo clasificó el script lo que acaba de recibir
        const c = await pedir({ accion: "sensores", token: TOKEN });
        const z = (c.zonas || []).find(x => x.zona === ZONA);
        if (!z) { estado.textContent = "Enviado, pero no se encontró la zona en la hoja."; return; }
        const linea = k => `${k[0].toUpperCase() + k.slice(1)}: ${z[k].valor} → ${NOMBRES[k][z[k].nivel]}`;
        estado.textContent = "Enviado a las " + z.hora + "\n" + linea("luz") + "\n" + linea("sonido") + "\n" + linea("personas")
          + "\nNivel general: " + ["bajo", "medio", "alto"][z.nivel];
      } catch (e) {
        estado.textContent = "Sin conexión con el servidor: " + e.message;
      }
    }

    document.getElementById("enviar").addEventListener("click", enviar);
    setInterval(() => { if (document.getElementById("auto").checked) enviar(); }, 20000);
  </script>
</body>
</html>
