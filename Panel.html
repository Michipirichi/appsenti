<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de turnos</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; padding: 2rem 1rem; }
    main { max-width: 360px; width: 100%; text-align: center; }
    input, button { font-size: 1.1rem; padding: .7rem; width: 100%; box-sizing: border-box; margin-top: .6rem; }
    button { color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #btn-consulta { background: #4A7C59; }
    #btn-meson { background: #2563eb; }
    #turno { font-size: 5rem; font-weight: 700; margin: .5rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Panel de turnos</h1>
    <input id="clave" type="password" placeholder="Clave del personal">
    <button id="btn-consulta">Llamar siguiente · Consulta</button>
    <button id="btn-meson">Llamar siguiente · Mesón</button>
    <p id="mensaje">Aún no se ha llamado a nadie.</p>
    <div id="turno"></div>
  </main>

  <script>
    // PEGA AQUÍ la URL /exec de tu implementación (la misma de index.html)
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbymsltMTw96xQ_nwT5t-NHWkkPikSlA3IbTxi385R32zndN1uRhSETfm-yhKdqx9OQmUw/exec";

    const mensaje = document.getElementById("mensaje");
    const turno = document.getElementById("turno");
    const botones = [document.getElementById("btn-consulta"), document.getElementById("btn-meson")];

    async function llamar(tipo) {
      const clave = document.getElementById("clave").value.trim();
      if (!clave) { mensaje.textContent = "Ingresa la clave del personal."; return; }
      botones.forEach(b => b.disabled = true);
      mensaje.textContent = "Llamando…";
      turno.textContent = "";
      try {
        const resp = await fetch(URL_SCRIPT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ accion: "siguiente", tipo: tipo, token: clave })
        });
        const r = await resp.json();
        const nombre = tipo === "meson" ? "mesón" : "consulta";
        if (r.status === "success") {
          mensaje.textContent = "Llamando al turno de " + nombre + ":";
          turno.textContent = (tipo === "meson" ? "M-" : "") + r.turno;
        } else if (r.status === "empty") {
          mensaje.textContent = "No hay pacientes en espera para " + nombre + ".";
        } else {
          mensaje.textContent = r.message || "No se pudo llamar.";
        }
      } catch (e) {
        mensaje.textContent = "Sin conexión con el servidor.";
      }
      botones.forEach(b => b.disabled = false);
    }

    document.getElementById("btn-consulta").addEventListener("click", () => llamar("consulta"));
    document.getElementById("btn-meson").addEventListener("click", () => llamar("meson"));
  </script>
</body>
</html>
